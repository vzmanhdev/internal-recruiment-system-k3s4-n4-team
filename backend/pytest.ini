[pytest]
# Only the isolated suite. The root-level test_*.py files are manual scripts that reset/seed
# the configured (development) database and must never be collected automatically.
testpaths = tests
# Keep pytest's own cache and tmp_path dirs inside the project (drive D:), not in the C: temp dir.
cache_dir = .pytest_cache
addopts = --basetemp=.pytest_cache/basetemp
